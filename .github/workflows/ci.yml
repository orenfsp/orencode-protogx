name: ProtoGX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protogx-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fsp
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: ci_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp -d fsp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ci_test_only
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-test-only
      DJANGO_DEBUG: "0"
      DEMO_SEED_ENABLED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test --noinput
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: python scripts/check_openapi_schema.py

  frontend:
    name: Frontend / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  design:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python scripts/check_design_contract.py

  e2e:
    name: E2E / Compose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: protogx_ci
      DJANGO_DEBUG: "1"
      DEMO_SEED_ENABLED: "1"
      DEMO_ENVIRONMENT: local
      DJANGO_SECRET_KEY: ci-test-only
      POSTGRES_PASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install openpyxl==3.1.5
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: docker compose up -d --build --wait
      - run: curl --fail --retry 20 --retry-delay 3 --retry-connrefused http://localhost:3000/
      - run: npm run test:e2e -- --workers=1
        working-directory: frontend
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
