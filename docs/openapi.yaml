        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        registration_deadline:
          type: string
          format: date-time
        age_reference_date:
          type: string
          format: date
          nullable: true
        allow_ties:
          type: boolean
        location:
          type: string
          maxLength: 250
        regulations:
          type: string
        calendar_entry:
          type: integer
