          type: integer
          readOnly: true
        coach_name:
          type: string
          readOnly: true
        athlete:
          type: integer
          nullable: true
          readOnly: true
        athlete_name:
          type: string
          readOnly: true
        discipline:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/CoachLinkStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
