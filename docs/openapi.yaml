        title:
          type: string
          maxLength: 250
        discipline:
          type: integer
        discipline_name:
          type: string
          readOnly: true
        age_groups:
          type: array
          items:
            type: integer
        age_group_details:
          type: array
          items:
            $ref: '#/components/schemas/AgeGroup'
