components:
  schemas:
    ActiveRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    AgeGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        min_age:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        max_age:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - max_age
      - min_age
      - name
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        competition:
          type: integer
        athlete:
          type: integer
        athlete_name:
          type: string
          readOnly: true
        age_group:
          type: integer
        submitted_by:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        decision_reason:
          type: string
          readOnly: true
        decided_by:
          type: integer
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - age_group
      - athlete
      - athlete_name
      - competition
      - decided_at
      - decided_by
      - decision_reason
      - id
      - status
      - submitted_at
      - submitted_by
    ApplicationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - На рассмотрении
        * `approved` - Одобрена
        * `rejected` - Отклонена
    AthleteHistory:
      type: object
      properties:
        competition_id:
          type: integer
        competition_title:
          type: string
        version:
          type: integer
        published_at:
          type: string
          format: date-time
        row:
          type: object
          additionalProperties: {}
      required:
      - competition_id
      - competition_title
      - published_at
      - row
      - version
    AthleteRating:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        athlete:
          type: integer
        athlete_name:
          type: string
        season:
          type: integer
        discipline:
          type: integer
        discipline_code:
          type: string
        discipline_name:
          type: string
        base_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        prize_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        coefficient:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        rating_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        calculated_at:
          type: string
          format: date-time
        placement:
          type: integer
          readOnly: true
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/RatingContribution'
          readOnly: true
      required:
      - athlete
      - athlete_name
      - base_score
      - breakdown
      - coefficient
      - discipline
      - discipline_code
      - discipline_name
      - id
      - placement
      - rating_score
      - season
    AthleteRestriction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        athlete:
          type: integer
        kind:
          $ref: '#/components/schemas/KindEnum'
        starts_at:
          type: string
          format: date
        ends_at:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AthleteRestrictionStatusEnum'
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - athlete
      - created_at
      - created_by
      - ends_at
      - id
      - kind
      - starts_at
    AthleteRestrictionStatusEnum:
      enum:
      - active
      - revoked
      type: string
      description: |-
        * `active` - Активно
        * `revoked` - Отменено
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Me'
      required:
      - user
    CalendarEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        entry_number:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 200
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        reference_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - entry_number
      - id
      - source
      - title
      - year
    CategoryApplicationCreate:
      type: object
      properties:
        requested_category:
          $ref: '#/components/schemas/JudgeCategoryEnum'
