openapi: 3.0.3
info:
  title: FSP OrenKod API
  version: 0.1.0
paths:
  /api/v1/auth/active-role/:
    post:
      operationId: v1_auth_active_role_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActiveRole'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/disciplines/:
    get:
      operationId: v1_disciplines_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Discipline'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ActiveRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Me'
      required:
      - user
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Discipline:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 200
      required:
      - code
      - name
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 200
        roles:
          type: array
          items:
            type: string
          readOnly: true
        active_role:
          type: string
          nullable: true
          readOnly: true
      required:
      - active_role
      - email
      - full_name
      - id
      - roles
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        full_name:
          type: string
          maxLength: 200
        date_of_birth:
          type: string
          format: date
        consent:
          type: boolean
        consent_version:
          type: string
          maxLength: 40
        guardian_name:
          type: string
          maxLength: 200
        guardian_relationship:
          type: string
          maxLength: 100
        guardian_consent:
          type: boolean
          default: false
      required:
      - consent
      - consent_version
      - date_of_birth
      - email
      - full_name
      - password
    RoleEnum:
      enum:
      - federation
      - athlete
      - coach
      - judge
      type: string
      description: |-
        * `federation` - Federation
        * `athlete` - Athlete
        * `coach` - Coach
        * `judge` - Judge
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
