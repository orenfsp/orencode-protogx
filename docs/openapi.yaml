      - competition_type
      - created_at
      - created_by
      - discipline
      - discipline_name
      - ends_at
      - format
      - id
      - level
      - location
      - registration_deadline
      - regulations
      - starts_at
      - state
      - template
      - title
      - updated_at
    Csrf:
