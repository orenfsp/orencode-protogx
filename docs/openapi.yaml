components:
  schemas:
    ActiveRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    AgeGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        min_age:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        max_age:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - max_age
      - min_age
      - name
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        competition:
          type: integer
        athlete:
          type: integer
        athlete_name:
          type: string
          readOnly: true
        age_group:
          type: integer
        submitted_by:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        decision_reason:
          type: string
          readOnly: true
        decided_by:
          type: integer
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - age_group
      - athlete
      - athlete_name
      - competition
      - decided_at
      - decided_by
      - decision_reason
      - id
      - status
      - submitted_at
      - submitted_by
    ApplicationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - На рассмотрении
        * `approved` - Одобрена
        * `rejected` - Отклонена
    AthleteHistory:
      type: object
      properties:
        competition_id:
          type: integer
        competition_title:
          type: string
        version:
          type: integer
        published_at:
          type: string
          format: date-time
        row:
          type: object
          additionalProperties: {}
      required:
      - competition_id
      - competition_title
      - published_at
      - row
      - version
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Me'
      required:
      - user
    CalendarEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
        entry_number:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 200
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        reference_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - entry_number
      - id
      - source
      - title
      - year
    CoachLink:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        coach:
          type: integer
          readOnly: true
        coach_name:
          type: string
          readOnly: true
        athlete:
          type: integer
          nullable: true
          readOnly: true
        athlete_name:
          type: string
          readOnly: true
        discipline:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/CoachLinkStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - athlete
      - athlete_name
      - coach
      - coach_name
      - created_at
      - discipline
      - id
      - status
    CoachLinkDecision:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CoachLinkDecisionStatusEnum'
      required:
      - status
    CoachLinkDecisionStatusEnum:
      enum:
      - confirmed
      - rejected
      type: string
      description: |-
        * `confirmed` - confirmed
        * `rejected` - rejected
    CoachLinkRequest:
      type: object
      properties:
        athlete_email:
          type: string
          format: email
        discipline:
          type: integer
      required:
      - athlete_email
      - discipline
    CoachLinkStatusEnum:
      enum:
      - pending
      - confirmed
      - rejected
      type: string
      description: |-
        * `pending` - Ожидает
        * `confirmed` - Подтверждено
        * `rejected` - Отклонено
    Competition:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 250
        discipline:
          type: integer
        discipline_name:
          type: string
          readOnly: true
        age_groups:
          type: array
          items:
            type: integer
        age_group_details:
          type: array
          items:
            $ref: '#/components/schemas/AgeGroup'
          readOnly: true
        level:
          type: string
          maxLength: 100
        competition_type:
          type: string
          maxLength: 100
        format:
          $ref: '#/components/schemas/FormatEnum'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        registration_deadline:
          type: string
          format: date-time
        age_reference_date:
          type: string
          format: date
          nullable: true
        allow_ties:
          type: boolean
        location:
          type: string
          maxLength: 250
        regulations:
          type: string
        calendar_entry:
          type: integer
          nullable: true
        template:
          type: integer
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
